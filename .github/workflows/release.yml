name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '"auto" applies whatever changesets have accumulated on main. Any other value is passed to `changeset version --snapshot <value>` for an ad hoc pre-release (e.g. "beta").'
        required: true
        default: auto
      dist_tag:
        description: 'npm dist-tag to publish under. Leave empty to auto-detect: the prerelease identifier (e.g. "beta" from 0.2.0-beta.0), or "latest" for a stable version.'
        required: false
        default: ''

# Trusted publishing: npm authenticates this workflow via OIDC, so no NPM_TOKEN
# secret is needed. Configure the link on npmjs.com first, for every package
# published from this repo: package Settings -> Publishing access -> Trusted
# publishers -> GitHub.
permissions:
  contents: write # push the version commit/tags and create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Check for pending changesets
        id: changesets
        run: |
          if [ -z "$(ls -A .changeset/*.md 2>/dev/null | grep -v README.md)" ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changesets pending; nothing to release."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply changesets (bump versions, write changelogs)
        if: steps.changesets.outputs.pending == 'true'
        run: |
          if [ "${{ inputs.version }}" = "auto" ]; then
            npx changeset version
          else
            npx changeset version --snapshot "${{ inputs.version }}"
          fi

      - name: Determine dist-tag
        if: steps.changesets.outputs.pending == 'true'
        id: tag
        run: |
          TAG="${{ inputs.dist_tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ inputs.version }}" = "auto" ]; then
              TAG="latest"
            else
              TAG="${{ inputs.version }}"
            fi
          fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"

      # Trusted publishing: no NODE_AUTH_TOKEN — npm exchanges the OIDC token
      # issued by GitHub for a short-lived publish credential, per package.
      - name: Publish changed packages
        if: steps.changesets.outputs.pending == 'true'
        run: |
          npm install -g npm@11
          npx changeset publish --tag "${{ steps.tag.outputs.npm_tag }}"

      - name: Commit, tag and push
        if: steps.changesets.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: version packages" || echo "::notice::Nothing to commit"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        if: steps.changesets.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            pkg="${tag%@*}"
            changelog_path="packages/${pkg#@kiritan/}/CHANGELOG.md"
            if [ "$pkg" = "kiritan" ]; then changelog_path="packages/kiritan/CHANGELOG.md"; fi
            notes="$(awk '/^## /{if (seen++) exit} seen' "$changelog_path" 2>/dev/null || true)"
            gh release create "$tag" --title "$tag" --notes "${notes:-See CHANGELOG.md}"
          done
