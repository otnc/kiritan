name: ci

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # extensions/vim's tests run against real headless vim and nvim processes (skipped, not failed, if either is unavailable) — ubuntu-latest doesn't ship either by default. apt's neovim package is too old for vim.system/vim.fs.root (added in 0.10), so install a real release directly instead.
      - run: sudo apt-get update && sudo apt-get install -y vim
      - name: Install Neovim
        run: |
          curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf nvim-linux-x86_64.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          rm nvim-linux-x86_64.tar.gz
      - run: npm install
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run docs:verify

  # skills/kiritan is published as an Agent Skill (installed via `npx skills add otnc/kiritan --skill kiritan`), so CI keeps it valid: skills/validate.mjs checks the SKILL.md frontmatter, body size, and reference links against the Agent Skills spec (https://agentskills.io/specification), and the skills CLI step confirms a plain checkout still yields the skill (`--list` only lists and exits — it never installs or prompts).
  agent-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills/kiritan against the Agent Skills spec
        run: node skills/validate.mjs
      - name: Skills CLI recognizes the skill
        run: npx --yes skills add . --list | grep -q kiritan
