name: ci

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # extensions/vim's tests run against a real headless vim (skipped, not failed, if it's unavailable) — ubuntu-latest doesn't ship it by default.
      - run: sudo apt-get update && sudo apt-get install -y vim
      - run: npm install
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run test
